name: Workflow CI FirahMaulida Advanced

on:
  push:
    branches: [main]

env:
  PYTHON_VERSION: "3.12.7"
  DOCKER_IMAGE_NAME: "firahmaulida/telco-churn-mlflow"
  MLFLOW_VERSION: "2.19.0"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Training via MLflow Project (Kriteria 3 - Basic & Skilled)
  # ═══════════════════════════════════════════════════════════════════════════
  train:
    name: "🚀 MLflow Project Training"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip dihapus untuk menghindari error path requirements.txt

      - name: "⚙️ Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub pandas scikit-learn

      - name: "🔑 Set DagsHub Credentials"
        run: |
          echo "MLFLOW_TRACKING_USERNAME=firahmaulida" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/firahmaulida/Eksperimen_SML_FirahMaulida.mlflow" >> $GITHUB_ENV

      - name: "🧠 Run MLflow Project"
        run: |
          # REVISI: Menggunakan --env-manager local sesuai instruksi reviewer
          mlflow run MLProject \
            --env-manager local \
            --experiment-name "Telco_Churn_CI_FirahMaulida"

      - name: "📤 Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-firah
          path: MLProject/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Push Docker Image (Kriteria 3 - Advanced)
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🔐 Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "⚙️ Install MLflow & Docker Tools"
        run: |
          pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub scikit-learn pandas

      - name: "🏗️ Build Docker Image"
        run: |
          # Membangun image docker dari model yang ada di DagsHub
          mlflow models build-docker \
            --model-uri "https://dagshub.com/firahmaulida/Eksperimen_SML_FirahMaulida.mlflow" \
            --name "${{ env.DOCKER_IMAGE_NAME }}:latest"

      - name: "📤 Push to Docker Hub"
        run: |
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
