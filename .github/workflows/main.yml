name: Workflow CI FirahMaulida Final Bintang 5

on:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12.7"
  DOCKER_IMAGE_NAME: "firahmaulida/telco-churn-mlflow"
  MLFLOW_VERSION: "2.19.0"

jobs:
  train:
    name: "🚀 MLflow Project Training"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "⚙️ Install All Dependencies"
        run: |
          python -m pip install --upgrade pip
          # Kita instal SEMUA library yang dipakai di modelling.py
          pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub pandas scikit-learn matplotlib seaborn

      - name: "🔑 Set DagsHub Credentials"
        run: |
          echo "MLFLOW_TRACKING_USERNAME=firahmaulida" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/firahmaulida/Eksperimen_SML_FirahMaulida.mlflow" >> $GITHUB_ENV

      - name: "🧠 Run MLflow Project"
        run: |
          # REVISI FINAL: Memastikan path benar dan menggunakan env local
          mlflow run MLProject --env-manager local --experiment-name "Telco_Churn_CI_FirahMaulida"

      - name: "📤 Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-results-firah
          path: MLProject/artifacts/

  docker:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: train
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "🔐 Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: "🏗️ Build & Push Docker"
        run: |
          # Kita pakai build manual agar lebih ringan di GitHub Actions
          docker build -t ${{ env.DOCKER_IMAGE_NAME }}:latest ./MLProject
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
