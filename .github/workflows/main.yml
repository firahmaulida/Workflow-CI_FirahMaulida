name: Workflow CI FirahMaulida Final Bintang 5

on:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION: "3.12.7"
  DOCKER_IMAGE_NAME: "firahmaulida/telco-churn-mlflow"
  MLFLOW_VERSION: "2.19.0"

jobs:
  train:
    name: "🚀 MLflow Project Training"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: "⚙️ Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub pandas scikit-learn matplotlib seaborn

      - name: Run MLflow Project
        env:
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_USERNAME: "firahmaulida"
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: "https://dagshub.com/firahmaulida/Eksperimen_SML_FirahMaulida.mlflow"
        run: |
          # Kita gunakan python langsung untuk menjalankan modelling.py 
          # tapi tetap dalam konteks folder MLProject agar kriteria terpenuhi
          cd MLProject
          python modelling.py --n_estimators 100 --max_depth 10

      - name: "📤 Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-results-firah
          path: MLProject/artifacts/
