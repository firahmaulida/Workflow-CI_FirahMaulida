name: Workflow CI FirahMaulida Final Debug

on:
  push:
    branches: [ main ]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.7'

      - name: "⚙️ Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 dagshub pandas scikit-learn matplotlib seaborn

      - name: "🔍 Debug: List Files (Cek Path)"
        run: ls -R

      - name: "🧠 Run MLflow Project"
        env:
          MLFLOW_TRACKING_USERNAME: "firahmaulida"
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: "https://dagshub.com/firahmaulida/Eksperimen_SML_FirahMaulida.mlflow"
        run: |
          # Kita masuk ke folder MLProject dan jalankan dari sana
          mlflow run MLProject --env-manager local --experiment-name "Telco_Churn_CI_FirahMaulida"

      - name: "📤 Upload Artifacts"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-firah
          path: MLProject/artifacts/
