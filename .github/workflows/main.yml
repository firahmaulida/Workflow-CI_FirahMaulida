name: Workflow CI FirahMaulida Advanced

on:
  push:
    branches: [ main ]

env:
  PYTHON_VERSION   : "3.12.7"
  DOCKER_IMAGE_NAME: "firahmaulida/telco-churn-mlflow" # Ganti dengan username DockerHub kamu
  MLFLOW_VERSION   : "2.19.0"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: Training via MLflow Project
  # ═══════════════════════════════════════════════════════════════════════════
  train:
    name: "🚀 MLflow Project Training"
    runs-on: ubuntu-latest

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python ${{ env.PYTHON_VERSION }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          # cache: pip  <-- DIHAPUS agar tidak error lagi

      - name: "⚙️ Install Dependencies"
        run: |
          pip install --upgrade pip
          pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub pandas scikit-learn

      - name: "🔑 Set DagsHub Credentials"
        run: |
          echo "MLFLOW_TRACKING_USERNAME=firahmaulida" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_PASSWORD=${{ secrets.DAGSHUB_TOKEN }}" >> $GITHUB_ENV
          echo "MLFLOW_TRACKING_URI=https://dagshub.com/firahmaulida/Eksperimen_SML_FirahMaulida.mlflow" >> $GITHUB_ENV

      - name: "🧠 Run MLflow Project"
        run: |
          # Menjalankan MLflow project di folder MLProject
          mlflow run MLProject --no-conda --experiment-name "Telco_Churn_CI_FirahMaulida"

      - name: "📤 Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: MLProject/  # Menyimpan seluruh folder proyek sebagai bukti kriteria 3 skilled

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: Build & Push Docker Image (Advanced)
  # ═══════════════════════════════════════════════════════════════════════════
  docker:
    name: "🐳 Build & Push Docker Image"
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: "⚙️ Install MLflow"
        run: pip install mlflow==${{ env.MLFLOW_VERSION }} dagshub

      - name: "🔐 Login to Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "🏗️ Build Docker Image"
        run: |
          # Perintah sakti untuk build docker model MLflow
          # Menggunakan model yang baru saja dilatih di DagsHub (atau panggil model URI)
          mlflow models build-docker \
            --model-uri "https://dagshub.com/firahmaulida/Eksperimen_SML_FirahMaulida.mlflow" \
            --name "${{ env.DOCKER_IMAGE_NAME }}:latest"
            
      - name: "📤 Push to Docker Hub"
        run: docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
